apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bijouterie
  namespace: argocd
spec:
  project: default
  source:
    # Argo CD doit recevoir un accès en lecture à ce dépôt privé.
    repoURL: https://github.com/nakir00/bijouterie-k8s.git
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: bijouterie
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
