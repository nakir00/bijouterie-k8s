apiVersion: v1
kind: Secret
metadata:
  name: mysql-secret
  namespace: bijouterie
  labels:
    app: bijouterie
    tier: database
type: Opaque
# Valeurs de démonstration du projet, à remplacer avant une utilisation réelle.
# Un Secret Kubernetes n'est pas chiffré par son encodage base64.
stringData:
  MYSQL_ROOT_PASSWORD: rootpass
  MYSQL_DATABASE: bijouterie
  MYSQL_USER: bijoux
  MYSQL_PASSWORD: bijouxpass
