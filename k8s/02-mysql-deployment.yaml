apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: bijouterie
  labels:
    app: bijouterie
    tier: database
spec:
  replicas: 1
  # Le sélecteur doit correspondre aux labels des pods.
  selector:
    matchLabels:
      app: bijouterie
      tier: database
  template:
    metadata:
      labels:
        app: bijouterie
        tier: database
    spec:
      containers:
        - name: mysql
          # Adapter le tag au numéro du build publié par Jenkins.
          image: nabyyy/bijouterie-mysql:1
          ports:
            - name: mysql
              containerPort: 3306
          # Toutes les variables MySQL proviennent du Secret.
          envFrom:
            - secretRef:
                name: mysql-secret
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          # Sans volume persistant, la base est réinitialisée si le pod est recréé.
