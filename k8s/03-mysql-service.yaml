apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: bijouterie
  labels:
    app: bijouterie
    tier: database
spec:
  # Adresse stable accessible uniquement dans le cluster.
  type: ClusterIP
  selector:
    app: bijouterie
    tier: database
  ports:
    - name: mysql
      port: 3306
      targetPort: 3306
