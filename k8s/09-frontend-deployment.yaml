apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: bijouterie
  labels:
    app: bijouterie
    tier: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bijouterie
      tier: frontend
  template:
    metadata:
      labels:
        app: bijouterie
        tier: frontend
    spec:
      containers:
        - name: frontend
          # Adapter le tag au numéro du build publié par Jenkins.
          image: nabyyy/bijouterie-frontend:1
          ports:
            - name: http
              containerPort: 80
          envFrom:
            - configMapRef:
                name: frontend-config
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
